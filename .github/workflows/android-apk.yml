
name: Build VIT MessMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
      - name: Install dependencies
        working-directory: extracted/messmate_src
        run: npm install

      - name: Build application
        working-directory: extracted/messmate_src
        run: npm run build

      - name: Create Android project
        working-directory: extracted/messmate_src
        run: npx cap add android

      - name: Sync Android project
        working-directory: extracted/messmate_src
        run: npx cap sync android

      - name: Generate APK
        working-directory: extracted/messmate_src/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIT-MessMate-APK
          path: extracted/messmate_src/android/app/build/outputs/apk/debug/app-debug.apk
